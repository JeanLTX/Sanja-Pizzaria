<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#15803d">
<title>Pagamento Pix | Sanja Pizzaria</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7f4;color:#17251b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f7faf7,#eef4ef)}
main{width:min(100%,460px);background:#fff;border:1px solid #e1e8e1;border-radius:22px;padding:28px;box-shadow:0 18px 55px #17351c14}
.brand{font-size:12px;letter-spacing:.16em;font-weight:800;color:#15803d;text-transform:uppercase}
h1{font-size:26px;line-height:1.15;margin:12px 0 8px}
p{line-height:1.55;color:#536157}
.intro{margin:12px 0 18px}
.amount{font-size:30px;font-weight:850;margin:14px 0;color:#17251b}
.qr-wrap{display:flex;justify-content:center;margin:14px auto;padding:10px;width:max-content;max-width:100%;border:1px solid #e1e8e1;border-radius:16px;background:white}
#qr{width:208px;height:208px;max-width:100%;object-fit:contain}
.label{display:block;margin:16px 0 7px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#536157}
textarea{display:block;width:100%;min-height:104px;resize:vertical;padding:12px;border:1px solid #cfd9cf;border-radius:12px;background:#f8faf8;color:#26352a;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
button{width:100%;border:0;border-radius:12px;padding:15px 18px;margin-top:12px;background:#15803d;color:white;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.hint{font-size:13px;margin-bottom:0}
.error{color:#b42318}
.receiver{margin-top:14px;padding:13px;border-radius:12px;background:#f5f8f5;font-size:13px}
.receiver strong{display:block;color:#17251b;margin-bottom:3px}
@media(max-width:380px){main{padding:22px}h1{font-size:24px}#qr{width:184px;height:184px}}
</style>
</head>
<body>
<main>
  <div class="brand">Sanja Pizzaria</div>
  <h1>Pagamento Pix</h1>
  <p class="intro">Escaneie o QR Code com o aplicativo do seu banco ou copie o código Pix para pagar neste mesmo celular.</p>
  <div id="amount" class="amount" hidden></div>
  <div id="qr-wrap" class="qr-wrap" hidden><img id="qr" alt="QR Code Pix do pedido" width="208" height="208"></div>
  <label class="label" for="payload">Pix copia e cola</label>
  <textarea id="payload" aria-label="Código Pix copia e cola" readonly spellcheck="false" placeholder="Carregando pagamento Pix..."></textarea>
  <button id="copy" type="button" disabled>Carregando pagamento...</button>
  <div class="receiver"><strong>Antes de confirmar</strong>Confira o nome do recebedor e o valor no aplicativo do banco.</div>
  <p id="status" class="hint" role="status" aria-live="polite">Preparando os dados do pagamento...</p>
</main>
<script src="supabase-config.js?v=20261029-pix-page-v2"></script>
<script src="pix-qr.min.js?v=20261019-pix-v1"></script>
<script>
(async()=>{
 const field=document.getElementById('payload');
 const button=document.getElementById('copy');
 const status=document.getElementById('status');
 const amountEl=document.getElementById('amount');
 const qrWrap=document.getElementById('qr-wrap');
 const qr=document.getElementById('qr');
 const params=new URLSearchParams(location.search);
 let amount=params.get('v');
 let reference=params.get('r');
 const shortCode=params.get('c') || location.pathname.match(/^\/p\/([A-Za-z0-9]{8})\/?$/)?.[1];
 const fail=(message='Este link Pix é inválido ou expirou. Peça à Sanja para enviar um novo link.')=>{
   field.value='';field.placeholder=message;button.disabled=true;button.textContent='Link indisponível';
   status.textContent='Não foi possível carregar o pagamento. Solicite um novo link à Sanja.';
   status.classList.add('error');
 };
 try{
   if(shortCode){
     if(!/^[A-Za-z0-9]{8}$/.test(shortCode)) return fail();
     const config=window.SUPABASE_CONFIG||{};
     if(!config.url||!config.publishableKey) return fail('Não foi possível conectar ao serviço de pagamento.');
     const response=await fetch(config.url+'/rest/v1/rpc/resolve_public_pix_link',{
       method:'POST',
       headers:{apikey:config.publishableKey,Authorization:'Bearer '+config.publishableKey,'Content-Type':'application/json'},
       body:JSON.stringify({p_code:shortCode})
     });
     if(!response.ok) throw new Error('Não foi possível localizar o pedido Pix.');
     const result=await response.json();
     const record=Array.isArray(result)?result[0]:result;
     if(!record) return fail();
     amount=Number(record.amount).toFixed(2);
     reference=record.reference;
   }
   if(!amount||!/^\d+\.\d{2}$/.test(amount)||Number(amount)<=0||!reference||!/^[A-Za-z0-9@.+_-]{1,25}$/.test(reference)||!window.SanjaPixQR) return fail();
   const payload=window.SanjaPixQR.buildPixPayload({key:'45097930819',amount:Number(amount),merchantName:'Luan Vinicius da Silva Gonçalves',merchantCity:'Brazopolis',txid:reference});
   field.value=payload;
   amountEl.textContent='R$ '+Number(amount).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
   amountEl.hidden=false;
   if(window.SanjaPixQR.qrDataUrl){qr.src=window.SanjaPixQR.qrDataUrl(payload,6,4);qrWrap.hidden=false;}
   button.disabled=false;button.textContent='Copiar código Pix';
   status.textContent='Depois de pagar, confirme o pagamento com a Sanja pelo WhatsApp.';
 }catch(error){fail('Não foi possível carregar este pagamento Pix. Peça um novo link à Sanja.');}
 button.addEventListener('click',async()=>{
   try{
     if(navigator.clipboard&&isSecureContext) await navigator.clipboard.writeText(field.value);
     else{field.focus();field.select();if(!document.execCommand('copy'))throw Error('copy failed');}
     status.textContent='Código Pix copiado! Cole no aplicativo do seu banco.';
     button.textContent='Código copiado!';
   }catch(_){field.focus();field.select();status.textContent='Selecione o código acima e copie manualmente.';}
 });
})();
</script>
</body>
</html>
