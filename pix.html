<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#15803d">
<title>Pagamento Pix | Sanja Pizzaria</title>
<style>:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7f4;color:#17251b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(100%,460px);background:white;border:1px solid #e1e8e1;border-radius:22px;padding:28px;box-shadow:0 14px 40px #17351c12}.brand{font-size:12px;letter-spacing:.16em;font-weight:800;color:#15803d;text-transform:uppercase}h1{font-size:26px;line-height:1.15;margin:12px 0 8px}p{line-height:1.55;color:#536157}.amount{font-size:28px;font-weight:800;margin:16px 0;color:#17251b}textarea{width:100%;min-height:108px;resize:vertical;padding:12px;border:1px solid #cfd9cf;border-radius:12px;background:#f8faf8;color:#26352a;font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}button{width:100%;border:0;border-radius:12px;padding:15px 18px;margin-top:12px;background:#15803d;color:white;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.hint{font-size:13px;margin-bottom:0}.error{color:#b42318}</style>
</head>
<body><main><div class="brand">Sanja Pizzaria</div><h1>Pagamento Pix</h1><p>Toque no bot?o para copiar o c?digo. Depois, abra o aplicativo do seu banco, escolha Pix Copia e Cola e confira o recebedor e o valor antes de pagar.</p><div id="amount" class="amount" hidden></div><textarea id="payload" aria-label="C?digo Pix copia e cola" readonly spellcheck="false" placeholder="Carregando pagamento Pix?"></textarea><button id="copy" type="button" disabled>Carregando?</button><p id="status" class="hint" role="status" aria-live="polite">Confira o recebedor e o valor no aplicativo do banco antes de confirmar.</p></main>
<script src="supabase-config.js?v=20261028-short-pix-v1"></script><script src="pix-qr.min.js?v=20261019-pix-v1"></script>
<script>
(async()=>{
 const field=document.getElementById('payload'),button=document.getElementById('copy'),status=document.getElementById('status'),amountEl=document.getElementById('amount');
 const params=new URLSearchParams(location.search); let amount=params.get('v'),reference=params.get('r'); const shortCode=params.get('c');
 const fail=(message)=>{field.value='';field.placeholder=message||'Link Pix inv?lido ou expirado. Pe?a ? Sanja para enviar o link novamente.';button.disabled=true;button.textContent='Link indispon?vel';status.textContent='N?o foi poss?vel carregar o pagamento. Solicite um novo link ? Sanja.';status.classList.add('error')};
 try {
  if(shortCode){
   if(!/^[A-Za-z0-9]{8}$/.test(shortCode)) return fail();
   const config=window.SUPABASE_CONFIG||{};
   if(!config.url||!config.publishableKey) return fail();
   const response=await fetch(config.url+'/rest/v1/rpc/resolve_public_pix_link',{method:'POST',headers:{apikey:config.publishableKey,Authorization:'Bearer '+config.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({p_code:shortCode})});
   if(!response.ok) throw new Error('Lookup failed');
   const result=await response.json(); const record=Array.isArray(result)?result[0]:result;
   if(!record) return fail();
   amount=Number(record.amount).toFixed(2);reference=record.reference;
  }
  if(!amount||!/^[0-9]+\.[0-9]{2}$/.test(amount)||Number(amount)<=0||!reference||!/^[A-Za-z0-9@.+_-]{1,25}$/.test(reference)||!window.SanjaPixQR) return fail();
  field.value=window.SanjaPixQR.buildPixPayload({key:'45097930819',amount:Number(amount),merchantName:'Luan Vinicius da Silva Gon?alves',merchantCity:'Brazopolis',txid:reference});
  amountEl.textContent='R$ '+Number(amount).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});amountEl.hidden=false;
  button.disabled=false;button.textContent='Copiar c?digo Pix';
 } catch(_){return fail()}
 button.addEventListener('click',async()=>{try{if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(field.value);else{field.focus();field.select();if(!document.execCommand('copy'))throw Error()}status.textContent='C?digo Pix copiado! Agora cole no aplicativo do seu banco.';button.textContent='C?digo copiado ?'}catch(_){field.focus();field.select();status.textContent='Selecione o c?digo acima e copie manualmente.'}});
})();
</script></body></html>
