<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#15803d">
<title>Pagamento Pix | Sanja Pizzaria</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17251b;background:#f4f7f4;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f7faf7,#eef4ef)}main{width:min(100%,460px);background:#fff;border:1px solid #e1e8e1;border-radius:22px;padding:28px;box-shadow:0 18px 55px #17351c14}.brand{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:15px;background:#dcfce7;color:#15803d;font-size:14px;font-weight:900;letter-spacing:.02em}.eyebrow{margin:16px 0 4px;font-size:11px;font-weight:850;letter-spacing:.16em;color:#15803d;text-transform:uppercase}h1{font-size:26px;line-height:1.15;margin:4px 0 8px}p{line-height:1.55;color:#536157}.intro{margin:12px 0 18px;font-size:14px}.amount{font-size:30px;font-weight:850;margin:14px 0;color:#17251b}.qr-wrap{display:flex;justify-content:center;margin:16px auto;padding:10px;width:max-content;max-width:100%;border:1px solid #e1e8e1;border-radius:16px;background:white;box-shadow:0 4px 15px #17351c0a}#qr{display:block;width:208px;height:208px;max-width:100%;object-fit:contain}.label{display:block;margin:16px 0 7px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#536157}textarea{display:block;width:100%;min-height:104px;resize:vertical;padding:12px;border:1px solid #cfd9cf;border-radius:12px;background:#f8faf8;color:#26352a;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}button{width:100%;border:0;border-radius:12px;padding:15px 18px;margin-top:12px;background:#15803d;color:#fff;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.hint{font-size:13px;margin-bottom:0}.error{color:#b42318}.receiver{margin-top:14px;padding:13px;border-radius:12px;background:#f5f8f5;font-size:13px}.receiver strong{display:block;color:#17251b;margin-bottom:3px}.status-icon{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;margin-right:6px}@media(max-width:380px){main{padding:22px}h1{font-size:24px}#qr{width:184px;height:184px}}
</style>
</head>
<body>
<main>
  <div class="brand" aria-hidden="true">PIX</div>
  <div class="eyebrow">Sanja Pizzaria</div>
  <h1>Pagamento Pix</h1>
  <p class="intro">Escaneie o QR Code com o aplicativo do seu banco ou copie o c&oacute;digo Pix para pagar neste mesmo celular.</p>
  <div id="amount" class="amount" hidden></div>
  <div id="qr-wrap" class="qr-wrap" hidden><img id="qr" alt="QR Code Pix do pedido" width="208" height="208"></div>
  <label class="label" for="payload">Pix copia e cola</label>
  <textarea id="payload" aria-label="C&oacute;digo Pix copia e cola" readonly spellcheck="false" placeholder="Carregando pagamento Pix..."></textarea>
  <button id="copy" type="button" disabled>Carregando pagamento...</button>
  <div class="receiver"><strong>Antes de confirmar</strong>Confira o nome do recebedor e o valor no aplicativo do banco.</div>
  <p id="status" class="hint" role="status" aria-live="polite"><span class="status-icon"></span>Preparando os dados do pagamento...</p>
</main>
<script>window.SUPABASE_CONFIG=Object.freeze({url:"https://tbzdpvyotlfzpowsniou.supabase.co",publishableKey:"sb_publishable_8YfnXsF1P-1rSDRDKfDDBQ_EaeW4eLc"});</script>
<script src="pix-qr.min.js?v=20261019-pix-v1"></script>
<script>
(async()=>{
 const field=document.getElementById('payload');
 const button=document.getElementById('copy');
 const status=document.getElementById('status');
 const amountEl=document.getElementById('amount');
 const qrWrap=document.getElementById('qr-wrap');
 const qr=document.getElementById('qr');
 const params=new URLSearchParams(location.search);
 let amount=params.get('v');
 let reference=params.get('r');
 const shortCode=params.get('c') || location.pathname.match(/^\/p\/([A-Za-z0-9]{8})\/?$/)?.[1];
 const fail=(message='Este link Pix \u00e9 inv\u00e1lido ou expirou. Pe\u00e7a \u00e0 Sanja para enviar um novo link.')=>{
   field.value='';field.placeholder=message;button.disabled=true;button.textContent='Link indispon\u00edvel';
   status.textContent='N\u00e3o foi poss\u00edvel carregar o pagamento. Solicite um novo link \u00e0 Sanja.';
   status.classList.add('error');
 };
 try{
   if(shortCode){
     if(!/^[A-Za-z0-9]{8}$/.test(shortCode)) return fail();
     const config=window.SUPABASE_CONFIG||{};
     if(!config.url||!config.publishableKey) return fail('N\u00e3o foi poss\u00edvel conectar ao servi\u00e7o de pagamento.');
     const response=await fetch(config.url+'/rest/v1/rpc/resolve_public_pix_link',{
       method:'POST',headers:{apikey:config.publishableKey,Authorization:'Bearer '+config.publishableKey,'Content-Type':'application/json'},
       body:JSON.stringify({p_code:shortCode})
     });
     if(!response.ok) throw new Error('Pedido Pix n\u00e3o encontrado.');
     const result=await response.json();const record=Array.isArray(result)?result[0]:result;
     if(!record) return fail();amount=Number(record.amount).toFixed(2);reference=record.reference;
   }
   if(!amount||!/^\d+\.\d{2}$/.test(amount)||Number(amount)<=0||!reference||!window.SanjaPixQR) return fail();
   // O TXID do Pix aceita no máximo 25 caracteres.
   reference=String(reference).replace(/[^A-Za-z0-9@.+_-]/g,'').slice(-25);
   if(!reference) return fail();
   const payload=window.SanjaPixQR.buildPixPayload({key:'45097930819',amount:Number(amount),merchantName:'Luan Vinicius da Silva Goncalves',merchantCity:'Brazopolis',txid:reference});
   field.value=payload;
   amountEl.textContent='R$ '+Number(amount).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});amountEl.hidden=false;
   if(window.SanjaPixQR.qrDataUrl){qr.src=window.SanjaPixQR.qrDataUrl(payload,6,4);qrWrap.hidden=false;}else{throw new Error('Gerador do QR Code indispon\u00edvel.');}
   button.disabled=false;button.textContent='Copiar c\u00f3digo Pix';
   status.textContent='Depois de pagar, confirme o pagamento com a Sanja pelo WhatsApp.';
 }catch(error){fail('N\u00e3o foi poss\u00edvel carregar este pagamento Pix. Pe\u00e7a um novo link \u00e0 Sanja.');}
 button.addEventListener('click',async()=>{
   try{if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(field.value);else{field.focus();field.select();if(!document.execCommand('copy'))throw Error('copy failed');}status.textContent='C\u00f3digo Pix copiado! Cole no aplicativo do seu banco.';button.textContent='C\u00f3digo copiado!';}
   catch(_){field.focus();field.select();status.textContent='Selecione o c\u00f3digo acima e copie manualmente.';}
 });
})();
</script>
</body>
</html>
